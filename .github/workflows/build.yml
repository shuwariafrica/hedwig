name: "build"

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths-ignore: ["**.md"]
  push:
    branches: [main]
    tags: [v*]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: "test / ${{ matrix.arch }} / ${{ matrix.toolchain }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-2025
            toolchain: pinned
          - arch: aarch64
            runner: windows-11-arm
            toolchain: pinned
          # Toolchain coverage stays on x86_64: a second architecture answers
          # nothing that a question about the compiler asks.
          - arch: x86_64
            runner: windows-2025
            toolchain: beta
            rust: beta
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    # beta is early warning for the next stable; a beta regression must not block.
    continue-on-error: ${{ matrix.toolchain == 'beta' }}
    env:
      # The vendor, system and ABI are the same for every row, so the triple is
      # not a matrix dimension. Naming the ABI once here is also what stops a
      # row being edited into a target that disagrees with its own `arch`.
      TARGET: ${{ matrix.arch }}-pc-windows-msvc
      # Windows spells architectures differently from Rust, and winget's
      # `Architecture` field takes the Windows spelling. Two-valued, so a
      # conditional carries it; a third architecture needs a real mapping.
      ASSET: ${{ matrix.arch == 'aarch64' && 'arm64' || 'x64' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A row naming no `rust` takes the channel, components and targets from
      # rust-toolchain.toml, which rustup installs on the first cargo command.
      # RUSTUP_TOOLCHAIN is the only thing that outranks that file.
      - name: Override Toolchain
        if: matrix.rust != ''
        env:
          CHANNEL: ${{ matrix.rust }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          rustup toolchain install $env:CHANNEL --profile minimal --component clippy --target $env:TARGET
          if ($LASTEXITCODE -ne 0) { throw "rustup could not install $env:CHANNEL (exit code $LASTEXITCODE)" }
          "RUSTUP_TOOLCHAIN=$env:CHANNEL" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # The programs the suites run against, each pinned by version and SHA-256;
      # each line the script emits names the variable a suite reads.
      - name: Fetch Test Tools
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          ./scripts/fetch-test-tools.ps1 | ForEach-Object { "$($_.Name)=$($_.Value)" } |
              Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # --target is what pins the MSVC ABI; relying on the runner's default host
      # would leave it to the image. The suites run hedwig.exe as it is built
      # here, so the build comes first.
      - name: Build
        run: cargo build --workspace --release --locked --target $env:TARGET

      # Tests run the profile that ships.
      - name: Test
        run: cargo test --workspace --release --locked --target $env:TARGET

      # Of the tests ignored for what they need, a hosted runner provides only
      # an elevated session; the rest need an SSH server on loopback, a
      # registered GnuPG for Windows or a COM port.
      - name: Test In An Elevated Session
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $only = 'a_pipe_that_belongs_to_someone_else_is_sent_nothing'
          cargo test --release --locked --target $env:TARGET -p hedwig-support --test end_to_end -- --ignored --exact $only
          if ($LASTEXITCODE -ne 0) { throw "$only failed (exit code $LASTEXITCODE)" }

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked --target $env:TARGET -- -D warnings

      - name: Docs
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --locked --target $env:TARGET

      - name: Stage Release Binary
        if: startsWith(github.ref, 'refs/tags/v') && matrix.toolchain == 'pinned'
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $binary = Join-Path -Path 'target' -ChildPath $env:TARGET -AdditionalChildPath 'release', 'hedwig.exe'
          Copy-Item -LiteralPath $binary -Destination "hedwig-$env:ASSET.exe"

      - name: Upload Release Binary
        if: startsWith(github.ref, 'refs/tags/v') && matrix.toolchain == 'pinned'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.arch }}
          path: hedwig-${{ env.ASSET }}.exe
          retention-days: 1
          if-no-files-found: error

  static_analysis:
    name: Static Analysis
    # Linux, so no step here may compile the Windows-only crates.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      # Change each version together with its release asset's SHA-256.
      SHELLCHECK_VERSION: v0.11.0
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
      SHFMT_VERSION: v3.14.1
      SHFMT_SHA256: 76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf
      PESTER_VERSION: 6.2.0
      PSSCRIPTANALYZER_VERSION: 1.25.0
      # Must stay inside the checkout for .shellcheckrc and .editorconfig to apply.
      WORKFLOW_SCRIPTS: target/workflow-scripts
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify Formatting
        id: fmt
        continue-on-error: true
        run: |
          set -euo pipefail
          cargo fmt --all --check

      - name: Verify Supply Chain
        id: deny
        continue-on-error: true
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

      - name: Install Shell Tools
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?}" "${GITHUB_PATH:?}" "${SHELLCHECK_VERSION:?}" "${SHELLCHECK_SHA256:?}" \
            "${SHFMT_VERSION:?}" "${SHFMT_SHA256:?}"
          bin="${RUNNER_TEMP}/bin"
          mkdir -p "${bin}"
          archive="${RUNNER_TEMP}/shellcheck.tar.xz"
          curl --fail --silent --show-error --location --output "${archive}" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          printf '%s  %s\n' "${SHELLCHECK_SHA256}" "${archive}" | sha256sum --check --strict
          tar --extract --xz --file "${archive}" --directory "${bin}" --strip-components=1 \
            "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          curl --fail --silent --show-error --location --output "${bin}/shfmt" \
            "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64"
          printf '%s  %s\n' "${SHFMT_SHA256}" "${bin}/shfmt" | sha256sum --check --strict
          chmod +x "${bin}/shfmt"
          printf '%s\n' "${bin}" >>"${GITHUB_PATH}"

      - name: Install PowerShell Modules
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $gallery = @{
              Repository      = 'PSGallery'
              TrustRepository = $true
              Scope           = 'CurrentUser'
          }
          Install-PSResource -Name Pester -Version $env:PESTER_VERSION @gallery
          Install-PSResource -Name PSScriptAnalyzer -Version $env:PSSCRIPTANALYZER_VERSION @gallery

      # Fails any run: block with no shell of its own or from its job's defaults:
      # the runner's default differs between Linux and Windows.
      - name: Extract Workflow Scripts
        id: extract
        continue-on-error: true
        run: |
          set -euo pipefail
          : "${WORKFLOW_SCRIPTS:?}"
          rm -rf "${WORKFLOW_SCRIPTS}"
          mkdir -p "${WORKFLOW_SCRIPTS}"
          for workflow in .github/workflows/*.yml; do
            name=$(basename "${workflow}" .yml)
            # shellcheck disable=SC2016 # $job and $default are yq variables.
            steps=$(yq '.jobs | to_entries | .[] | .key as $job | (.value.defaults.run.shell // "") as $default | .value.steps | to_entries | .[] | select(.value | has("run")) | [$job, .key, .value.shell // $default] | @tsv' "${workflow}")
            if [[ -z "${steps}" ]]; then
              continue
            fi
            while IFS=$'\t' read -r job index shell; do
              case "${shell}" in
                bash) extension='sh' ;;
                pwsh) extension='ps1' ;;
                *)
                  printf '::error file=%s::job %s, step %s runs under shell "%s"; declare bash or pwsh\n' \
                    "${workflow}" "${job}" "${index}" "${shell}"
                  exit 1
                  ;;
              esac
              # yq prints a newline after the block's own final one; capturing
              # strips both, so the file ends as the block does.
              script=$(yq ".jobs.\"${job}\".steps[${index}].run" "${workflow}")
              printf '%s\n' "${script}" >"${WORKFLOW_SCRIPTS}/${name}.${job}.${index}.${extension}"
            done <<<"${steps}"
          done
          ls -1 "${WORKFLOW_SCRIPTS}"

      - name: Lint Shell
        id: shellcheck
        continue-on-error: true
        run: |
          set -euo pipefail
          : "${WORKFLOW_SCRIPTS:?}"
          shellcheck --version
          shellcheck --severity=style "${WORKFLOW_SCRIPTS}"/*.sh

      - name: Verify Shell Formatting
        id: shfmt
        continue-on-error: true
        run: |
          set -euo pipefail
          : "${WORKFLOW_SCRIPTS:?}"
          shfmt --version
          shfmt --diff "${WORKFLOW_SCRIPTS}"/*.sh

      - name: Lint PowerShell
        id: psscriptanalyzer
        continue-on-error: true
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          Import-Module -Name PSScriptAnalyzer -RequiredVersion $env:PSSCRIPTANALYZER_VERSION
          $findings = @(Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1)
          if ($findings) {
              $findings | Format-List -Property ScriptPath, Line, RuleName, Severity, Message
              throw "PSScriptAnalyzer reported $($findings.Count) finding(s)."
          }

      - name: Test Release Script
        id: pester
        continue-on-error: true
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          Import-Module -Name Pester -RequiredVersion $env:PESTER_VERSION
          $configuration = New-PesterConfiguration
          $configuration.Run.Path = '.'
          $configuration.Run.PassThru = $true
          $configuration.Output.Verbosity = 'Detailed'
          $result = Invoke-Pester -Configuration $configuration
          # A run that discovers no tests still reports Passed.
          if ($result.Result -ne 'Passed' -or $result.PassedCount -eq 0) {
              throw "Pester: $($result.PassedCount) passed, $($result.FailedCount) failed, $($result.NotRunCount) not run."
          }

      # Aggregate so one run reports every failing check, not just the first.
      - name: Check for failures
        if: always()
        env:
          FMT: ${{ steps.fmt.outcome }}
          DENY: ${{ steps.deny.outcome }}
          EXTRACT: ${{ steps.extract.outcome }}
          SHELLCHECK: ${{ steps.shellcheck.outcome }}
          SHFMT: ${{ steps.shfmt.outcome }}
          PSSCRIPTANALYZER: ${{ steps.psscriptanalyzer.outcome }}
          PESTER: ${{ steps.pester.outcome }}
        run: |
          set -euo pipefail
          : "${FMT:?}" "${DENY:?}" "${EXTRACT:?}" "${SHELLCHECK:?}" "${SHFMT:?}" "${PSSCRIPTANALYZER:?}" "${PESTER:?}"
          failed=()
          if [[ "${FMT}" == failure ]]; then failed+=(rustfmt); fi
          if [[ "${DENY}" == failure ]]; then failed+=(cargo-deny); fi
          if [[ "${EXTRACT}" == failure ]]; then failed+=(workflow-script-extraction); fi
          if [[ "${SHELLCHECK}" == failure ]]; then failed+=(shellcheck); fi
          if [[ "${SHFMT}" == failure ]]; then failed+=(shfmt); fi
          if [[ "${PSSCRIPTANALYZER}" == failure ]]; then failed+=(PSScriptAnalyzer); fi
          if [[ "${PESTER}" == failure ]]; then failed+=(Pester); fi
          if ((${#failed[@]} > 0)); then
            printf '::error::Static analysis checks failed: %s\n' "${failed[*]}"
            exit 1
          fi

  # The one check a pull request's merge requires. A required check that is
  # skipped counts as passing, so this runs whatever became of the jobs it
  # needs and fails unless every one of them succeeded.
  gate:
    name: gate
    needs: [test, static_analysis]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    defaults:
      run:
        shell: bash
    steps:
      # Read from the needs context whole, so a job added to `needs` is
      # reported and required without touching this step.
      - name: Check Every Needed Job Succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          : "${NEEDS:?}" "${GITHUB_STEP_SUMMARY:?}"
          if ! command -v jq >/dev/null 2>&1; then
            printf '::error title=gate::jq is not on this runner\n'
            exit 1
          fi
          {
            printf '| Job | Result |\n| --- | --- |\n'
            jq --raw-output 'to_entries[] | "| \(.key) | \(.value.result) |"' <<<"${NEEDS}"
          } >>"${GITHUB_STEP_SUMMARY}"
          failed=$(jq --raw-output '[to_entries[] | select(.value.result != "success") | .key] | join(", ")' <<<"${NEEDS}")
          if [[ -n "${failed}" ]]; then
            printf '::error title=gate::These jobs did not succeed: %s\n' "${failed}"
            exit 1
          fi

  release:
    name: Publish Release
    needs: [test, static_analysis]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Backstop for the same check in ./release. The binary reports
      # CARGO_PKG_VERSION, so a mismatched tag ships binaries that disagree with
      # the release they are attached to.
      - name: Verify Tag Matches Crate Version
        run: |
          set -euo pipefail
          : "${GITHUB_REF_NAME:?}"
          line=$(grep --max-count=1 '^version = ' Cargo.toml)
          crate_version=${line#version = \"}
          crate_version=${crate_version%\"}
          if [[ "${crate_version}" != "${GITHUB_REF_NAME#v}" ]]; then
            printf '::error::tag %s does not match Cargo.toml version %s\n' "${GITHUB_REF_NAME}" "${crate_version}"
            exit 1
          fi

      - name: Collect Binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release
          pattern: binary-*
          merge-multiple: true

      - name: Generate Checksums
        run: |
          set -euo pipefail
          cd release
          sha256sum -- * >SHA256SUMS
          cat SHA256SUMS

      # Authenticode is unavailable: Azure Artifact Signing admits only US, CA,
      # EU and UK organisations. A detached OpenPGP signature is what users have
      # to verify against instead.
      - name: Import Signing Key
        id: signing-key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7
        with:
          gpg_private_key: ${{ secrets.OSS_PUBLISH_USER_SIGNING_KEY }}
          trust_level: 5

      # SECURITY.md and the README are what a user is told to trust, so they are
      # the source of truth: a key that does not match them must not sign a
      # release, and a rotation that misses either document fails here. Git
      # hashes do not collide with this pattern, being lower case.
      - name: Verify Signing Key Is The Published One
        env:
          FINGERPRINT: ${{ steps.signing-key.outputs.fingerprint }}
        run: |
          set -euo pipefail
          : "${FINGERPRINT:?}"
          if ! fingerprints=$(grep --only-matching --no-filename --extended-regexp '[0-9A-F]{40}' README.md SECURITY.md); then
            printf '::error::README.md and SECURITY.md publish no fingerprint\n'
            exit 1
          fi
          published=$(sort --unique <<<"${fingerprints}")
          if [[ "${published}" == *$'\n'* ]]; then
            printf '::error::README.md and SECURITY.md must publish exactly one fingerprint, found: %s\n' "${published//$'\n'/ }"
            exit 1
          fi
          if [[ "${FINGERPRINT^^}" != "${published}" ]]; then
            printf '::error::signing key %s is not the published fingerprint %s\n' "${FINGERPRINT}" "${published}"
            exit 1
          fi
          printf 'signing key matches the published fingerprint: %s\n' "${published}"

      # A loop rather than `find -exec`, which reports success even when the
      # command it ran failed. The glob is expanded once, so the .asc files
      # this creates are not themselves signed.
      - name: Sign Release Artefacts
        run: |
          set -euo pipefail
          for artefact in release/*; do
            gpg --batch --yes --armor --detach-sign "${artefact}"
          done
          ls -l release/

      - name: Attest Build Provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/hedwig-*.exe

      # The release is created under the org app identity, not the ephemeral
      # default actor.
      - name: Mint Release Bot Token
        id: release-bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ steps.release-bot.outputs.token }}
          FINGERPRINT: ${{ steps.signing-key.outputs.fingerprint }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          : "${TAG:?}" "${REPO:?}" "${FINGERPRINT:?}"
          flags=()
          if [[ "${TAG}" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "${TAG}" --repo "${REPO}" --title "${TAG}" \
            --generate-notes --verify-tag "${flags[@]}" release/*
          # Restating the fingerprint here keeps it correct across key rotation.
          # It is a convenience, not the trust anchor: the key must be fetched
          # from a keyserver, never from the release it authenticates.
          gh release view "${TAG}" --repo "${REPO}" --json body --jq .body >notes.md
          # shellcheck disable=SC2016 # The backticks are a Markdown code fence.
          printf '\n## Verifying this download\n\nEvery asset has a detached signature beside it.\n\n```\ngpg --keyserver hkps://keyserver.ubuntu.com --recv-keys %s\ngpg --verify hedwig-x64.exe.asc hedwig-x64.exe\n```\n' \
            "${FINGERPRINT}" >>notes.md
          gh release edit "${TAG}" --repo "${REPO}" --notes-file notes.md

  winget:
    name: Submit to WinGet
    needs: release
    # The action only adds versions to a package already in the community
    # repository, so this stays off until one has been published by hand.
    if: vars.WINGET_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Submit Manifest Update
        uses: vedantmgoyal9/winget-releaser@4ffc7888bffd451b357355dc214d43bb9f23917e # v2
        with:
          identifier: ShuwariAfrica.Hedwig
          # Anchored so SHA256SUMS is never taken for an installer.
          installers-regex: 'hedwig-(x64|arm64)\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
