name: codeql

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Newly published queries against code that has not changed.
  schedule:
    - cron: "17 6 * * 1"
      timezone: Africa/Nairobi
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyse:
    name: ${{ matrix.area }} / codeql / analyse
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows: build-mode none still resolves types, and on Linux the
          # crates' std::os::windows and windows-sys do not resolve.
          - area: rust
            language: rust
            runner: windows-2025-vs2026
          - area: workflows
            language: actions
            runner: ubuntu-26.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialise CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyse
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
