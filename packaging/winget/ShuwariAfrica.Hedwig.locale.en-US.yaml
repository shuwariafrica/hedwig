PackageIdentifier: ShuwariAfrica.Hedwig
PackageVersion: 0.0.0
PackageLocale: en-US
Publisher: Shuwari Africa
PublisherUrl: https://github.com/shuwariafrica
PublisherSupportUrl: https://github.com/shuwariafrica/hedwig/issues
PackageName: Hedwig
PackageUrl: https://github.com/shuwariafrica/hedwig
License: MIT
LicenseUrl: https://github.com/shuwariafrica/hedwig/blob/main/LICENSE
ShortDescription: Lends a Windows workstation's GnuPG, SSH agent and Android devices to a remote over SSH
Description: |-
  Hedwig runs for the person signed in to a Windows workstation and lends what
  it holds - GnuPG and the keys on its smart cards, the SSH agent, Android
  devices through ADB - to a remote reached over a channel that already
  reaches it, such as SSH, with nothing of Hedwig's installed on the remote.
  Each remote is granted what it may use; a request the person has not
  settled is put to them by Hedwig's icon in the notification area, and its
  window shows what is reachable from where.
Moniker: hedwig
