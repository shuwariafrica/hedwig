ShortDescription: Forward the Windows gpg-agent to Linux hosts over ssh -R
Description: |-
  A loopback relay that makes gpg-agent on Windows forwardable with plain
  OpenSSH, so git commits on remote Linux hosts (VMs, servers, Coder
  workspaces) can be signed with an OpenPGP key held on a YubiKey plugged into
  the Windows machine. Speaks GnuPG's Windows socket emulation (port file plus
  nonce handshake), verifies both peers' identity at the OS level, and relays
  the restricted agent socket by default.
Moniker: hedwig
