[package]
name = "hedwig-support"
description = "The stand-in processes and the harness Hedwig's suites drive; never part of what ships"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = false

# A core that panics, hangs or faults on cue, and a client started with less
# than the suite has, need calls the shipped crates never make, so they are
# made here rather than in hedwig-win.
[dependencies]
hedwig-model.workspace = true
hedwig-win.workspace = true
hedwig-core.workspace = true
hedwig-client.workspace = true

[dependencies.windows-sys]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
]

[lints]
workspace = true
