[workspace]
resolver = "3"
members = [
    "crates/hedwig-model",
    "crates/hedwig-win",
    "crates/hedwig-core",
    "crates/hedwig-client",
    "crates/hedwig",
    "crates/hedwig-support",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
repository = "https://github.com/shuwariafrica/hedwig"
keywords = ["gpg", "ssh-agent", "adb", "yubikey", "forwarding"]
categories = ["network-programming", "os::windows-apis"]

[workspace.dependencies]
hedwig-model = { path = "crates/hedwig-model", version = "0.1.0" }
hedwig-win = { path = "crates/hedwig-win", version = "0.1.0" }
hedwig-core = { path = "crates/hedwig-core", version = "0.1.0" }
hedwig-client = { path = "crates/hedwig-client", version = "0.1.0" }
serde_json = "1.0.151"
windows-sys = "0.61"
zeroize = "1.9"

[workspace.lints.rust]
future_incompatible = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
unused = { level = "deny", priority = -1 }
elided_lifetimes_in_paths = "deny"
redundant_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unit_bindings = "deny"
unreachable_pub = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

exit = "deny"
expect_used = "deny"
indexing_slicing = "deny"
mem_forget = "deny"
multiple_unsafe_ops_per_block = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"

missing_errors_doc = "allow"
must_use_candidate = "allow"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
# Unwinding, not abort: a thread of the core that panics is joined as one that
# failed, and the core serves on.
